<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-Agency – Sắp ra mắt</title>
<meta name="description" content="T-Agency: phim doanh nghiệp, phim kỷ niệm, animation đào tạo nội bộ, nhận diện thương hiệu, key visual, VR360.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f10;--ink:#f4f1ea;--mut:#a9a49a;--acc:#e8432e}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.6 "Be Vietnam Pro",system-ui,sans-serif;display:grid;place-items:center;padding:6vw 5vw;overflow-x:clip}
main{max-width:760px;width:100%}
.mark{font-weight:800;font-size:clamp(56px,13vw,128px);line-height:.95;letter-spacing:-.03em}
.mark span{color:var(--acc)}
h1{font-size:clamp(22px,3.4vw,32px);font-weight:600;margin:28px 0 12px;line-height:1.25}
p{color:var(--mut);max-width:60ch}
ul{list-style:none;padding:0;margin:32px 0;display:flex;flex-wrap:wrap;gap:10px}
li{border:1px solid #3a3835;border-radius:999px;padding:8px 16px;font-size:15px}
.rec{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);animation:b 1.6s infinite}
@keyframes b{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.rec::before{animation:none}}
</style>
</head>
<body>
<main>
<div class="rec">Website đang hoàn thiện</div>
<div class="mark">T<span>-</span>Agency</div>
<h1>Kể câu chuyện doanh nghiệp bằng hình ảnh.</h1>
<p>Chúng tôi sản xuất phim và hình ảnh cho doanh nghiệp, tổ chức. Website chính thức sẽ sớm ra mắt.</p>
<ul>
<li>Phim doanh nghiệp</li><li>Phim kỷ niệm</li><li>Animation đào tạo nội bộ</li><li>Nhận diện thương hiệu</li><li>Key visual</li><li>VR360</li>
</ul>
</main>
</body>
</html>
